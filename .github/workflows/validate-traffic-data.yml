name: Validate traffic data

on:
  workflow_dispatch:
  push:
    paths:
      - "data/traffic-restrictions.json"
      - "scripts/filter-kumamoto-traffic.mjs"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JSON
        run: node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('data/traffic-restrictions.json','utf8')); if(!Array.isArray(d.items)) throw new Error('items must be an array'); console.log('traffic data valid:', d.items.length);"
